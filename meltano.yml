send_anonymous_usage_stats: false
project_id: "tap-cme"
default_environment: test
requires_meltano: ">=3.7"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-cme"
    namespace: "tap_cme"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging
    settings:
    - name: client_id
      label: API ID
      description: The OAuth API ID from CME Customer Center (My Profile, APIs)
      sensitive: true
    - name: client_secret
      label: API password
      description: The API ID's generated password
      sensitive: true
    - name: globex_group_codes
      kind: array
      label: Globex groups
      description: Globex group codes whose schedules each fetch asks for
    - name: api_url
      label: API URL
      description: Reference Data API v3 root
    - name: auth_url
      label: Token URL
      description: CME's OAuth token endpoint
    - name: capture_dir
      label: Capture folder
      description: Load a fetch saved to disk (manifest.json and its pages) at its own fetch times instead of CME
    settings_group_validation:
    - [client_id, client_secret, globex_group_codes]
    config:
      client_id: ${CME_API_ID}
      client_secret: ${CME_API_PASSWORD}
      globex_group_codes: [ZN]
    select:
    - trading_schedules.*
    - trading_schedules_fetches.*
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
